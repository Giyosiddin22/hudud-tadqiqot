<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahifa topilmadi — So'rovnoma Portali</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans',sans-serif;background:#f6f7f9;color:#182233;min-height:100vh;display:flex;flex-direction:column}
.stripe{display:flex;height:4px;flex-shrink:0}
.stripe div{flex:1}
.stripe .g{background:#1c3f66}.stripe .s{background:#eef1f5}.stripe .t{background:#2f7a52}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.code{font-family:var(--serif,'PT Serif',serif);font-size:72px;font-weight:700;color:#1c3f66;line-height:1}
h1{font-family:'PT Serif',serif;font-size:22px;font-weight:700;margin:14px 0 10px}
p{color:#5b6472;font-size:14.5px;margin-bottom:26px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:3px;font-size:14px;font-weight:700;text-decoration:none}
.primary{background:#1c3f66;color:#fff}
.primary:hover{background:#2563a1}
.outline{border:1px solid #dde1e7;color:#182233}
.outline:hover{background:#eef1f5}
</style>
</head>
<body>
<div class="stripe"><div class="g"></div><div class="s"></div><div class="t"></div></div>
<div class="wrap">
  <div>
    <div class="code">404</div>
    <h1>Sahifa topilmadi</h1>
    <p>Bunday manzil mavjud emas yoki havolada xatolik bor.</p>
    <div class="btns">
      <a class="btn primary" href="/index.html">Bosh sahifa</a>
      <a class="btn outline" href="/surveys.html">So'rovnomalar</a>
    </div>
  </div>
</div>
</body>
</html>
